# This file is an outline with only the primary keys. 
# NOTE: Additional tests should not be added to this template. Tests should be added the Tuva project instead.
# NOTE: Documentation and other information should be added to the Tuva project as well.
# The Tuva project input layer yml files can be found here: https://github.com/tuva-health/tuva/tree/main/models/input_layer

version: 2

models:
### final
# Claims input
  - name: eligibility
    config:
      tags: [claims, input_layer]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - enrollment_start_date
              - enrollment_end_date
              - "{{ '\"plan\"' if (target.type == 'fabric') else 'plan' }}"
              - payer
              - data_source

  - name: medical_claim
    config:
      tags: [claims, input_layer]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - claim_id
              - claim_line_number
              - data_source

  - name: pharmacy_claim
    config:
      tags: [claims, input_layer]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - claim_id
              - claim_line_number
              - data_source

  - name: provider_attribution
    config:
      tags: [claims, input_layer]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - year_month
              - "{{ '\"plan\"' if (target.type == 'fabric') else 'plan' }}"
              - payer
              - data_source

# Clinical input
  - name: appointment
    config:
      tags: [clinical, input_layer]
    columns:
      - name: appointment_id
        tests:
          - unique
          - not_null

  - name: condition
